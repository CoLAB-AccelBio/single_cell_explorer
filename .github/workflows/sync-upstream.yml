name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  sync:
    runs-on: ubuntu-24.04
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: false
          # Use a Personal Access Token (repo + workflow scopes) if upstream touches .github/workflows
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git lfs install --local
          git config lfs.allowincompletepush true

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/JMarzec/single-cell-explorer-21d646ca.git || true
          git fetch upstream main

      - name: Merge
        run: |
          git checkout main
          git merge upstream/main --allow-unrelated-histories --no-edit -X theirs

      - name: Mirror LFS objects (best effort)
        continue-on-error: true
        run: |
          git lfs fetch upstream main --include="public/heart_organoid_S1_3_annot.json"
          git lfs push origin main

      - name: Push
        run: git push --no-verify origin main
